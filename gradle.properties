# Top-level Gradle settings
# https://docs.gradle.org/current/userguide/gradle_properties.html

# JVM heap size for the Gradle daemon (increase on slow machines)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable parallel builds and build cache
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX and non-transitive R class
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Service loading (required by AGP 8.x when using Java 21)
org.gradle.jvmargs+=-Djava.system.class.loader=org.gradle.internal.system.UrlClassLoader

# Enable JVM toolchain auto-detection (AGP 8.1+)
org.gradle.toolchain.auto-detect=true
