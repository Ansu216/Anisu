name: Anisu Nightly APK

# Builds signed APKs and force-publishes them to the `apk-nightly` branch (the
# branch contents are fully replaced on every run). Can also be started by hand
# from the Actions tab (Run workflow).
#
# The two variants build in PARALLEL (one matrix leg each, on its own runner) and
# are published INDEPENDENTLY: as soon as the release build succeeds its APK is
# pushed, and as soon as the debug build succeeds its APK is pushed, regardless of
# the other leg. A failure on one side therefore never holds back the other. The
# two publish jobs share one concurrency group, so they never push at the same
# time, and each one folds the sibling variant of the same run into the branch it
# writes — so publishing one leg never drops the other.
#
# When the commit being built is the one `extract-fix-zip.yml` made after a
# `fix.zip` push, the publish jobs also write `fix-report.json` and
# `fix-report.md` (see `.github/scripts/fix-report.py`): they record who pushed
# the archive, the extraction commit and every file it changed. A build that is
# not an extraction carries the previous report over, so the last fix stays
# documented on the branch until the next one lands.

on:
  schedule:
    # Every hour, on the hour (UTC).
    - cron: '0 * * * *'
  # Refresh the nightly APK on every commit pushed to main.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which APK to publish'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

# Needed to push the apk-nightly branch.
permissions:
  contents: write

# Never let two nightly runs fight over the same branch.
concurrency:
  group: apk-nightly
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) One stamp for the whole run, so the APKs built by different runners in
  #    different seconds still carry the exact same version.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan the run
    runs-on: ubuntu-latest
    outputs:
      variant: ${{ steps.stamp.outputs.variant }}
      variants: ${{ steps.stamp.outputs.variants }}
      version_name: ${{ steps.stamp.outputs.version_name }}
      version_code: ${{ steps.stamp.outputs.version_code }}
      iso: ${{ steps.stamp.outputs.iso }}

    steps:
      - name: Compute the build stamp and the variant matrix
        id: stamp
        run: |
          set -euo pipefail

          VARIANT="${{ github.event.inputs.variant }}"
          if [ -z "$VARIANT" ]; then VARIANT="both"; fi
          case "$VARIANT" in
            both)    VARIANTS='["release","debug"]' ;;
            release) VARIANTS='["release"]' ;;
            debug)   VARIANTS='["debug"]' ;;
            *) echo "::error::Unknown variant '$VARIANT'"; exit 1 ;;
          esac

          echo "variant=$VARIANT"       >> "$GITHUB_OUTPUT"
          echo "variants=$VARIANTS"     >> "$GITHUB_OUTPUT"
          echo "version_name=$(date -u +'%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"
          echo "version_code=$(date -u +'%Y%m%d%H')"      >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"     >> "$GITHUB_OUTPUT"

          echo "Publishing variant(s): $VARIANT"

  # ---------------------------------------------------------------------------
  # 2) The variants build in parallel. `fail-fast: false` keeps the other leg
  #    running so one broken variant does not hide the state of the other.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.variant }} APK
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The ubuntu-latest image already ships the Android SDK at
      # $ANDROID_SDK_ROOT, so we only install the packages we need.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble the ${{ matrix.variant }} APK
        env:
           TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          case "${{ matrix.variant }}" in
            release) TASK="assembleRelease" ;;
            debug)   TASK="assembleDebug" ;;
            *) echo "::error::Unknown variant '${{ matrix.variant }}'"; exit 1 ;;
          esac
          # The version comes from the plan job so both legs agree; the release
          # build is minified by R8 (see app/build.gradle.kts).
          ./gradlew --no-daemon --stacktrace "$TASK" \
            -PversionCode="${{ needs.plan.outputs.version_code }}" \
            -PversionName="${{ needs.plan.outputs.version_name }}"

      - name: Verify the APK is signed (an unsigned build is never published)
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BUILD_TOOLS"
          APK="$(find "app/build/outputs/apk/${{ matrix.variant }}" -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced for variant ${{ matrix.variant }}"
            exit 1
          fi
          # `apksigner verify` exits non-zero for an unsigned or broken APK; the
          # second check refuses one that verified but carries no signer certificate.
          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"; then
            echo "::error::The ${{ matrix.variant }} APK is not validly signed — refusing to publish it."
            exit 1
          fi
          if ! "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -qi "certificate DN"; then
            echo "::error::The ${{ matrix.variant }} APK carries no signer certificate — refusing to publish it."
            exit 1
          fi

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: app/build/outputs/apk/${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3) Publish the release APK. This job needs only the release leg: it runs as
  #    soon as that leg's artifact exists, even while the debug leg is still
  #    building or has failed. The artifact-presence check below is what decides
  #    whether there is anything to publish, not the aggregate matrix result.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish the release APK
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.variant == 'both' || needs.plan.outputs.variant == 'release') }}
    runs-on: ubuntu-latest
    # The two publish jobs must never write the branch at the same time.
    concurrency:
      group: apk-nightly-branch
      cancel-in-progress: false

    steps:
      # The workspace is needed to inspect the commit that was built (and its
      # parent) when writing the fix.zip report.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the built release APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts

      - name: Check that the release APK was built
        id: presence
        run: |
          set -euo pipefail
          if [ -n "$(find artifacts -type f -name '*.apk' 2>/dev/null || true)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The release build produced no APK — nothing to publish for this variant."
          fi

      - name: Verify the APK is signed before publishing
        if: steps.presence.outputs.found == 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BUILD_TOOLS"
          APK="$(find artifacts -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK artifact was found — refusing to publish."
            exit 1
          fi
          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"; then
            echo "::error::The downloaded APK is not validly signed — refusing to publish it."
            exit 1
          fi
      - name: Stage the release build onto the branch
        id: stage
        if: steps.presence.outputs.found == 'true'
        env:
          VARIANT: release
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          ISO: ${{ needs.plan.outputs.iso }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          bash .github/scripts/stage-nightly.sh "$STAGE"

      - name: Stage the fix.zip report
        if: steps.presence.outputs.found == 'true'
        env:
          STAGE: ${{ steps.stage.outputs.dir }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          VARIANT: release
          ISO: ${{ needs.plan.outputs.iso }}
        run: python3 .github/scripts/fix-report.py "$STAGE"

      - name: Publish to the apk-nightly branch
        if: steps.presence.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ steps.stage.outputs.dir }}
          ISO: ${{ needs.plan.outputs.iso }}
        run: bash .github/scripts/push-nightly.sh "$STAGE"

  # ---------------------------------------------------------------------------
  # 4) Publish the debug APK. Symmetric to the release job above: it runs as soon
  #    as the debug leg's artifact exists, independently of the release leg.
  # ---------------------------------------------------------------------------
  publish-debug:
    name: Publish the debug APK
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.plan.outputs.variant == 'both' || needs.plan.outputs.variant == 'debug') }}
    runs-on: ubuntu-latest
    concurrency:
      group: apk-nightly-branch
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the built debug APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: artifacts

      - name: Check that the debug APK was built
        id: presence
        run: |
          set -euo pipefail
          if [ -n "$(find artifacts -type f -name '*.apk' 2>/dev/null || true)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The debug build produced no APK — nothing to publish for this variant."
          fi

      - name: Verify the APK is signed before publishing
        if: steps.presence.outputs.found == 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BUILD_TOOLS"
          APK="$(find artifacts -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK artifact was found — refusing to publish."
            exit 1
          fi
          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"; then
            echo "::error::The downloaded APK is not validly signed — refusing to publish it."
            exit 1
          fi
      - name: Stage the debug build onto the branch
        id: stage
        if: steps.presence.outputs.found == 'true'
        env:
          VARIANT: debug
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          ISO: ${{ needs.plan.outputs.iso }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          bash .github/scripts/stage-nightly.sh "$STAGE"

      - name: Stage the fix.zip report
        if: steps.presence.outputs.found == 'true'
        env:
          STAGE: ${{ steps.stage.outputs.dir }}
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          VARIANT: debug
          ISO: ${{ needs.plan.outputs.iso }}
        run: python3 .github/scripts/fix-report.py "$STAGE"

      - name: Publish to the apk-nightly branch
        if: steps.presence.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ steps.stage.outputs.dir }}
          ISO: ${{ needs.plan.outputs.iso }}
        run: bash .github/scripts/push-nightly.sh "$STAGE"
