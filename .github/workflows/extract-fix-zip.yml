name: Extract fix.zip

# When a commit whose **title** starts with `Maygodblastyou`, `fix` or `n` is
# pushed to `main`, the fix archive that push brought in (`.zip`, `.7z`, `.rar`,
# `.tar`, `.tar.gz`, `.tgz`, `.tar.bz2`, `.tar.xz`, … — anything at the root named
# `fix.*`) is extracted into the repository and committed back by the Actions bot
# with the message "extract fix.zip and updated the app". The APK build workflow is
# then started explicitly, so the new commit is built and published right away
# instead of waiting for the next hourly run.
#
# A **manual run always starts**: dispatch this workflow from the Actions tab and it
# applies every fix archive currently on `main`, whether or not a commit title matched,
# and it starts an APK build even when there was nothing new to extract. It is the
# "it did not run, run it by hand" button, and it must never come back skipped.
#
# The archive carries the project's own relative paths (for example
# `app/src/main/java/com/ansu/anime/...`), so every file lands in the right folder
# and sub-folder. Existing files are overwritten, missing ones are created, and
# **nothing is ever deleted**: the extraction only writes, `fix.*` itself is left in
# place, and the commit therefore stages additions and modifications only.
#
# Two rules keep this from ever applying an archive by accident, and both used to be
# a single check that ended up skipping *every* run:
#
#   * **A push only applies what that push brought in.** The script diffs the push
#     (the previous commit → this one) and extracts only the archives it touched, so
#     an old `fix.zip` sitting in the repository is never re-applied behind your back
#     by a later commit that happens to carry a trigger title.
#   * **No login is checked.** The old `if: github.actor == 'Maygodblastyou'` guard
#     skipped every run as soon as the account was renamed, and a manual run with it,
#     for the same reason. Only someone who can already push to `main` (or dispatch a
#     workflow) can reach this job at all, and the loop is closed by two independent
#     facts: the bot's own commit message matches no trigger title, and a push made
#     with the built-in `GITHUB_TOKEN` starts no workflow whatsoever.
#
# Two GitHub rules shape the two steps that are easy to get wrong:
#
#   * The built-in `GITHUB_TOKEN` is refused any write under `.github/workflows/`
#     ("refusing to allow a GitHub App to create or update workflow ... without
#     `workflows` permission"), and no `permissions:` block lifts that — it is a
#     platform rule, not a grantable scope. Since a fix archive usually contains the
#     whole repository, a commit that touched a workflow file would be rejected as a
#     whole and the fix would never land. So the extraction skips
#     `.github/workflows/**` and says so, unless a token that *does* have the
#     `workflows` scope is provided.
#   * A push made with `GITHUB_TOKEN` starts no other workflow, so the APK build is
#     dispatched explicitly. `workflow_dispatch` is the one event that still fires,
#     which is why `actions: write` is requested next to `contents: write`.
#
# Optional: store a classic PAT with the `workflow` scope (or a fine-grained one with
# Contents and Workflows read/write) as the repository secret `FIX_ZIP_TOKEN` and the
# checkout uses it, workflow files are extracted too, and the push is signed by that
# token. Without the secret everything still works; workflow files are simply left
# alone.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # Push the extracted files...
  contents: write
  # ...and start the build workflow afterwards.
  actions: write

# Never let two extraction runs fight over the same branch.
concurrency:
  group: extract-fix-zip
  cancel-in-progress: false

jobs:
  extract:
    name: Extract fix.zip and commit it
    runs-on: ubuntu-latest
    # A push rewrites the project only when the commit is *meant* to be a fix, which
    # its title says: Maygodblastyou (with anything after it), fix… or n…. A manual
    # run starts unconditionally — that is what "run it by hand" is for. A job skipped
    # here never starts a runner, so the other pushes cost nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.head_commit.message != null &&
        (
          startsWith(github.event.head_commit.message, 'Maygodblastyou') ||
          startsWith(github.event.head_commit.message, 'fix') ||
          startsWith(github.event.head_commit.message, 'n')
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # A full history, not a shallow one: the job commits and pushes, and a
          # truncated clone is a known cause of rejected pushes. This also lets the
          # rebase below and the "what did this push change" diff work properly.
          # (`release-apk.yml` needs depth 0 for the same class of reason.)
          fetch-depth: 0
          # Best-effort PAT. Note that it has to be passed *here*: whatever token this
          # step uses is what is stored as the remote credential, and that is the one
          # every later `git` command — the push included — will use.
          token: ${{ secrets.FIX_ZIP_TOKEN || github.token }}

      # 7z and rar are read through a 7-Zip binary. Runners usually ship one; when
      # they do not, this is the only thing that has to be installed. A failure here
      # is never fatal: a .zip or .tar.gz needs no 7-Zip at all, and the script says
      # so itself if a .7z really cannot be read.
      - name: Make sure a 7-Zip binary exists
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7za >/dev/null 2>&1 && ! command -v 7zz >/dev/null 2>&1; then
            echo "::notice::No 7-Zip on this runner — installing it so fix.7z / fix.rar can be read."
            sudo apt-get update -qq || true
            sudo apt-get install -y --no-install-recommends 7zip || sudo apt-get install -y --no-install-recommends p7zip-full || echo "::warning::7-Zip could not be installed; a fix.7z / fix.rar will fail to open."
          fi

      - name: Extract the fix archive
        id: extract
        env:
          # Only a token with the `workflows` scope may write .github/workflows/;
          # with the built-in token the script skips those entries on purpose.
          ANSU_ALLOW_WORKFLOWS: ${{ secrets.FIX_ZIP_TOKEN != '' }}
          # On a push: the commit before it, so only the archives *this* push brought
          # in are applied. On a manual run the event has no `before`, the variable is
          # empty, and the script applies every fix archive on main.
          ANSU_BEFORE: ${{ github.event.before }}
          ANSU_SHA: ${{ github.sha }}
        run: python3 .github/scripts/unpack-fix-zip.py

      - name: Commit, push and start the build
        id: commit
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing was removed anywhere, so this can only add or update files.
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed after extracting the fix archive — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "extract fix.zip and updated the app"

          # main may have moved while the archive was being extracted; rebase onto it
          # instead of failing with a non-fast-forward rejection.
          git pull --rebase origin main

          # Reported as an ::error:: annotation, which is readable from the API, so a
          # rejected push says exactly why without anyone opening the raw log.
          if ! PUSH_OUTPUT="$(git push origin HEAD:main 2>&1)"; then
            echo "::error::Pushing to main was rejected. git said: ${PUSH_OUTPUT//$'\n'/ }"
            exit 1
          fi

          echo "committed=true" >> "$GITHUB_OUTPUT"
          git --no-pager log -1 --stat

      # A run that landed a commit builds it. A **manual** run always builds, even
      # with nothing to extract, so this workflow doubles as "rebuild the APKs now".
      - name: Start the APK build workflow
        if: ${{ steps.commit.outputs.committed == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run apk-nightly.yml --ref main
          echo "::notice::Started the APK build for main."
