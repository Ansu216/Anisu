name: Extract fix.zip

# When a file named `fix.zip` is pushed to `main`, its contents are extracted into
# the repository and committed back by the Actions bot with the message
# "extract fix.zip and updated the app". The APK build workflow is then started
# explicitly, so the new commit is built and published right away instead of
# waiting for the next hourly run.
#
# The archive carries the project's own relative paths (for example
# `app/src/main/java/com/ansu/anime/...`), so every file lands in the right folder
# and sub-folder. Existing files are overwritten, missing ones are created, and
# **nothing is ever deleted**: the extraction only writes, `fix.zip` itself is
# left in place, and the commit therefore stages additions and modifications only.
#
# Why the build workflow is dispatched by hand: a push made with the repository's
# built-in `GITHUB_TOKEN` does not start other workflows. An explicit
# `workflow_dispatch` call does, and that is what makes the APK build run "by
# itself" after the commit. (The alternative is pushing with a personal access
# token, which would require storing a secret; the dispatch needs none.)

on:
  push:
    branches:
      - main
    paths:
      - 'fix.zip'
  workflow_dispatch:

permissions:
  # Push the extracted files...
  contents: write
  # ...and start the build workflow afterwards.
  actions: write

# Never let two extraction runs fight over the same branch.
concurrency:
  group: extract-fix-zip
  cancel-in-progress: false

jobs:
  extract:
    name: Extract fix.zip and commit it
    runs-on: ubuntu-latest
    # A run started by the bot itself is skipped, so the extraction cannot loop.
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # The path filter above fires on a deletion too, so removing fix.zip again
      # must not turn the run red: there is simply nothing to extract.
      - name: Check that there is a fix.zip to extract
        id: presence
        run: |
          set -euo pipefail
          if [ -f fix.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This commit has no fix.zip — nothing to extract."
          fi

      - name: Extract fix.zip
        if: ${{ steps.presence.outputs.present == 'true' }}
        run: python3 .github/scripts/unpack-fix-zip.py

      - name: Commit, push and start the build
        id: commit
        if: ${{ steps.presence.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing was removed anywhere, so this can only add or update files.
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed after extracting fix.zip — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "extract fix.zip and updated the app"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git --no-pager log -1 --stat

      - name: Start the APK build workflow
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run apk-nightly.yml --ref main
          echo "::notice::Started the APK build for the commit that has just landed."
