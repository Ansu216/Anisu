name: Anisu Autorelease

# Builds the signed release APK and attaches it to a GitHub Release. The debug APK is built on its
# own branch in parallel but is never published here.
#
# Triggers:
#   - automatically when a tag like v1.2.3 is pushed
#   - manually from the Actions tab (Run workflow), optionally with a tag
#
# The two variants build on SEPARATE branches of the graph: `build-release` and `build-debug` start
# together, each with its own matrix, and neither waits for the other. The `autorelease` job depends
# only on `build-release`, so a slow (or broken) debug build can never hold back a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0 (leave empty to take the version from version.txt)'
        required: false
        default: ''
      channel:
        description: 'Release type (auto = derive it from the version)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - stable
          - prerelease

# Needed to create the release and upload its assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) Resolve the tag, the version and the release type once, for every job.
  # ---------------------------------------------------------------------------
  plan:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
      version_code: ${{ steps.rel.outputs.version_code }}
      prerelease: ${{ steps.rel.outputs.prerelease }}
      channel: ${{ steps.rel.outputs.channel }}

    steps:
      # version.txt lives in the repository, so the job has to check it out before it can read it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the tag, the version and the release type
        id: rel
        env:
          CHANNEL_INPUT: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              # No tag typed in: the version comes from version.txt (line 1), the single
              # source of it, so a manual run names the release exactly the way its
              # changelog heading is written ("## [<version>]") instead of inventing a
              # date that no section in CHANGELOG.md carries. The "#" lines are comments,
              # as everywhere else that reads the file.
              VERSION_FROM_FILE="$(grep -v '^[[:space:]]*#' version.txt 2>/dev/null | sed -e 's/[[:space:]]//g' -e '/^$/d' | sed -n '1p' || true)"
              if [ -z "$VERSION_FROM_FILE" ]; then
                echo "::error::version.txt is missing its version (line 1) - it is the single source of it."
                exit 1
              fi
              TAG="v$VERSION_FROM_FILE"
            fi
          fi

          # v1.2.3 -> 1.2.3. The changelog headings use the version WITHOUT the
          # "v" prefix, and so does CHANGELOG.md lookups below.
          VERSION="${TAG#v}"

          # SemVer pre-release: anything after a "-" in the version (1.2.3-rc.1,
          # 2.0.0-beta, …) is a pre-release; a bare x.y.z is stable. The manual
          # input can override the derivation.
          # The version code comes from version.txt (line 2), the same value the
          # nightly workflow publishes. It is never derived from the tag or the run
          # number: Android refuses to install an APK whose code is lower than the
          # installed one and reports it as an "invalid package", so a release must
          # share the one monotonic counter with the nightlies instead of resetting
          # it. "#" lines are comments and are dropped here as everywhere else.
          VALUES="$(grep -v '^[[:space:]]*#' version.txt | sed -e 's/[[:space:]]//g' -e '/^$/d')"
          VERSION_CODE="$(printf '%s\n' "$VALUES" | sed -n '2p')"
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::version.txt is missing its version code (line 2) - it is the single source of it."
            exit 1
          fi
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "::error::version.txt line 2 (version code) is not an integer: '$VERSION_CODE'"; exit 1 ;;
          esac

          if [[ "$VERSION" == *-* ]]; then DERIVED="prerelease"; else DERIVED="stable"; fi
          case "${CHANNEL_INPUT:-auto}" in
            stable)     CHANNEL="stable";     PRERELEASE=false ;;
            prerelease) CHANNEL="prerelease"; PRERELEASE=true  ;;
            *)          CHANNEL="$DERIVED"
                        if [ "$DERIVED" = "prerelease" ]; then PRERELEASE=true; else PRERELEASE=false; fi ;;
          esac

          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$TAG version=$VERSION versionCode=$VERSION_CODE channel=$CHANNEL prerelease=$PRERELEASE"

  # ---------------------------------------------------------------------------
  # 2a) The release APK. Its own branch and its own one-entry matrix.
  # ---------------------------------------------------------------------------
  build-release:
    name: Build release APK
    needs: plan
    strategy:
      matrix:
        variant: [release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble the release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionCode="${{ needs.plan.outputs.version_code }}" \
            -PversionName="${{ needs.plan.outputs.version }}" \
            -PbuildCommit="${{ github.sha }}"

      - name: Verify the APK is signed (an unsigned build is never published)
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced"
            exit 1
          fi
          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"; then
            echo "::error::The release APK is not validly signed — refusing to publish it."
            exit 1
          fi

      - name: Upload the release APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2b) The debug APK. A separate branch that starts with the release build and
  #     is free to finish on its own; nothing downstream depends on it.
  # ---------------------------------------------------------------------------
  build-debug:
    name: Build debug APK
    needs: plan
    strategy:
      matrix:
        variant: [debug]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble the debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PversionCode="${{ needs.plan.outputs.version_code }}" \
            -PversionName="${{ needs.plan.outputs.version }}" \
            -PbuildCommit="${{ github.sha }}"

      - name: Upload the debug APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3) Publish the release. It waits only for the release build; the debug branch
  #    is never part of it, so a debug APK is never published here. The notes come
  #    from CHANGELOG.md — the `## [x.y.z]` section has to exist for the version
  #    being released (see CLAUDE.md).
  # ---------------------------------------------------------------------------
  autorelease:
    name: Publish the GitHub Release
    needs: [plan, build-release]
    if: ${{ always() && needs.plan.result == 'success' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Full history: `git describe` needs the previous tags and the changelog
      # section is matched against the file at the tagged commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the built release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts

      - name: Rename the APK for the release
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          APK_RELEASE="$(find artifacts -type f -name 'app-release.apk' | head -1 || true)"
          if [ -z "$APK_RELEASE" ]; then
            echo "::error::The release APK is required to publish a release — refusing to publish one without it."
            find artifacts -type f -print
            exit 1
          fi
          cp "$APK_RELEASE" "Ansu-${VERSION}.apk"
          ls -la Ansu-*.apk

      - name: Verify the APK is signed before publishing
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "build-tools;34.0.0" > /dev/null
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          APK="Ansu-${{ needs.plan.outputs.version }}.apk"
          if ! "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"; then
            echo "::error::$APK is not validly signed — refusing to publish the release."
            exit 1
          fi

      - name: Extract the changelog section for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ needs.plan.outputs.version }}"
          SECTION=""
          if [ -f CHANGELOG.md ]; then
            SECTION="$(awk -v v="$VERSION" '
              # Match the exact version, optionally followed by a channel suffix
              # (e.g. -rc.1), before the closing bracket.
              index($0, "## [" v "]") == 1 || index($0, "## [" v "-") == 1 { found = 1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)"
          fi
          if [ -z "$SECTION" ]; then
            echo "::warning title=Missing changelog entry::CHANGELOG.md has no '## [$VERSION]' section. Add one before tagging (see CLAUDE.md, section 7) — this release is being published with a placeholder body."
            SECTION="*No changelog entry found for \`$VERSION\`. See [CHANGELOG.md](../blob/main/CHANGELOG.md).*"
          fi
          {
            echo "section<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect the commits since the previous release
        id: commits
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log "$PREV_TAG..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null || true)"
          else
            COMMITS="$(git log --pretty=format:'- %s' --no-merges 2>/dev/null || true)"
          fi
          if [ -z "$COMMITS" ]; then COMMITS="- Initial release"; fi

          COMMIT_COUNT="$(printf '%s\n' "$COMMITS" | grep -c . || true)"
          if [ "$COMMIT_COUNT" -gt 7 ]; then
            COMMITS="$(printf '<details>\n<summary>Show all %s commits</summary>\n\n%s\n</details>' "$COMMIT_COUNT" "$COMMITS")"
          fi

          {
            echo "commits<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Anisu ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            Ansu-${{ needs.plan.outputs.version }}.apk
          body: |
            ## Anisu ${{ needs.plan.outputs.version }}
            **Release channel:** `${{ needs.plan.outputs.channel }}`

            ${{ steps.changelog.outputs.section }}

            ### Commits
            ${{ steps.commits.outputs.commits }}

            ---
            This release was built automatically from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
