<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anisu &middot; Backup screen preview</title>
<style>
  :root{
    --bg:#07080B; --elev:#0F1015; --glass:#1B1D27; --stroke:rgba(255,255,255,.08);
    --t1:#F3F4F6; --t2:#A0A3B1; --t3:#6B6E7C;
    --accent:#A78BFA; --accent-soft:rgba(167,139,250,.16);
    --ok:#4CD137; --err:#E0605A;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:#050609;color:var(--t1);
       font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--t3);font-size:13px;margin:0 0 22px;max-width:820px;line-height:1.55}
  .row{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
  figure{margin:0}
  figcaption{font-size:12px;color:var(--t3);margin-top:10px;max-width:390px;line-height:1.5}
  figcaption b{color:var(--t1)}
  .phone{width:390px;height:800px;background:var(--bg);border:1px solid #1d1f27;border-radius:30px;
         overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .status{height:26px;display:flex;justify-content:space-between;align-items:center;
          padding:0 18px;font-size:11px;color:var(--t2)}
  .back{display:flex;align-items:center;gap:14px;padding:6px 18px 0}
  .back span{font-size:22px;color:var(--t1)}
  .back b{font-size:20px;font-weight:700}
  .content{padding:14px 16px 24px;overflow:hidden}
  .card{background:linear-gradient(180deg,rgba(27,29,39,.5),rgba(27,29,39,.42));
        border:1px solid var(--stroke);border-radius:20px;backdrop-filter:blur(14px);margin-bottom:14px}
  .pad{padding:16px}
  .grp-label{font-size:11px;letter-spacing:.3px;font-weight:600;color:var(--t3);
             text-transform:uppercase;margin:18px 0 8px 16px}
  .r{display:flex;align-items:center;gap:14px;padding:15px 16px}
  .r + .r{border-top:1px solid var(--stroke)}
  .tile{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
        display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .txt{flex:1;min-width:0}
  .t{font-size:15px;font-weight:600;line-height:1.35}
  .d{font-size:14px;color:var(--t2);line-height:1.45;margin-top:2px}
  .d.ok{color:var(--ok)} .d.err{color:var(--err)}
  .trail{font-size:13px;color:var(--t2);flex:none;display:flex;align-items:center;gap:10px}
  .chev{color:var(--t3);font-size:16px}
  .sw{width:46px;height:27px;border-radius:14px;background:var(--accent);position:relative;flex:none}
  .sw i{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;
        color:var(--accent);font-size:12px;font-style:normal;display:flex;align-items:center;
        justify-content:center;font-weight:800}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:20px;
       background:var(--accent);color:#fff;font-weight:700;font-size:14px;margin-top:4px}
  .btn.ghost{background:transparent;border:1px solid var(--stroke);color:var(--t1);font-weight:500;margin-top:10px}
  .restore{font-size:13px;font-weight:700;color:var(--accent);flex:none;padding:6px 2px}
  .note{font-size:11px;color:var(--t3);margin-top:10px;line-height:1.5}
  .diff{background:rgba(167,139,250,.10);border:1px dashed rgba(167,139,250,.45);border-radius:12px;
        padding:8px 10px;font-size:12px;color:#D9D2FF;margin-bottom:14px}
  .legend{margin-top:14px;font-size:12px;color:var(--t2);line-height:1.6;max-width:390px}
  .legend b{color:var(--t1)}
</style>
</head>
<body>
  <h1>Anisu &middot; Backup, with the automatic copy</h1>
  <p class="sub">Settings &rarr; App &rarr; Backup. Same tokens as the app: glass cards, the 16dp row grid,
  a round accent icon tile, a switch with the check in its thumb.</p>

  <div class="row">
    <figure>
      <div class="phone">
        <div class="status"><span>11:46</span><span>65%</span></div>
        <div class="back"><span>&#8592;</span><b>Backup</b></div>
        <div class="content">
          <div class="diff">NEW: the AUTOMATIC group &mdash; a switch, when the last copy was written and a
            <b>Back up now</b> action &mdash; plus the SAVED ON THIS DEVICE list, where each copy can be restored
            on its own.</div>

          <div class="card">
            <div class="pad">
              <div class="t" style="font-weight:700">Backup &amp; restore</div>
              <div class="d" style="margin:6px 0 14px">Back up your settings, your watch progress and your local
                library into a single .anisu file you keep yourself. Restoring it brings everything back and
                Anisu restarts itself to apply it; the AniList sign-in is the only thing left out, because it is
                tied to this device.</div>
              <div class="btn">&#8681;&nbsp; Create backup (.anisu)</div>
              <div class="btn ghost">&#8635;&nbsp; Restore from backup</div>
              <div class="note">Backup saved (38 KB).</div>
            </div>
          </div>

          <div class="grp-label">Automatic</div>
          <div class="card">
            <div class="r">
              <div class="tile">&#9201;</div>
              <div class="txt">
                <div class="t">Automatic backup</div>
                <div class="d">A fresh .anisu copy every day, keeping the last 3</div>
              </div>
              <div class="sw"><i>&#10003;</i></div>
            </div>
            <div class="r">
              <div class="tile">&#128337;</div>
              <div class="txt">
                <div class="t">Last backup</div>
                <div class="d ok">Today, 04:12</div>
              </div>
            </div>
            <div class="r">
              <div class="tile">&#8682;</div>
              <div class="txt">
                <div class="t">Back up now</div>
                <div class="d">Write a copy without waiting for the daily one</div>
              </div>
              <div class="chev">&#8250;</div>
            </div>
          </div>

          <div class="grp-label">Saved on this device</div>
          <div class="card">
            <div class="r">
              <div class="tile">&#128230;</div>
              <div class="txt">
                <div class="t">12 Oct, 04:12</div>
                <div class="d">38 KB &middot; automatic</div>
              </div>
              <div class="restore">Restore</div>
            </div>
            <div class="r">
              <div class="tile">&#128230;</div>
              <div class="txt">
                <div class="t">11 Oct, 04:11</div>
                <div class="d">37 KB &middot; automatic</div>
              </div>
              <div class="restore">Restore</div>
            </div>
            <div class="r">
              <div class="tile">&#128230;</div>
              <div class="txt">
                <div class="t">10 Oct, 21:40</div>
                <div class="d">36 KB &middot; automatic</div>
              </div>
              <div class="restore">Restore</div>
            </div>
          </div>

          <div class="note">The daily copies sit in Anisu's own private storage, so they never fill your Downloads
            folder and no other app can read them. Restoring any of them restarts Anisu, exactly like the manual
            restore does.</div>
        </div>
      </div>
      <figcaption><b>The screen as it will look.</b> The manual card is untouched; everything automatic is
      added below it. The list keeps the three newest copies &mdash; the fourth is deleted as the new one is
      written &mdash; so it can never grow without bound.</figcaption>

      <div class="legend">
        <b>Behaviour:</b> when the switch is on the copy is written once a day in the background, the first one
        shortly after the app is opened, so nobody has to remember to tap <i>Create backup</i>.<br>
        <b>Storage:</b> only settings, watch progress and the local library &mdash; the same contents as the
        manual archive, without the AniList token, the extension APKs or the caches.
      </div>
    </figure>
  </div>
</body>
</html>
